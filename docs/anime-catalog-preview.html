<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kai — Anime Catalog (Phase 2 preview)</title>
  <link rel="stylesheet" href="../portable_config/webmods/Theme/AnimeCatalog.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #07090d;
      color: #f3ece4;
      font-family: "Montserrat", "Segoe UI", sans-serif;
    }
    /* Stub Stremio shell so the catalog can mount */
    .nav-content-container-zl9hQ {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .preview-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0.45rem 1rem;
      font-size: 0.78rem;
      background: #141820;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      color: rgba(243,236,228,0.75);
    }
    .preview-banner strong { color: #ff4d2e; }
    body { padding-top: 2rem; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;650;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="preview-banner">
    <strong>Phase 2 preview</strong> — requires MediaProvider on :8765
    (<code>start-media-provider.bat</code>). Open this file via a local static server if posters CORS-block <code>file://</code>.
  </div>
  <div class="main-nav-bars-container-wNjS5">
    <div class="nav-content-container-zl9hQ"></div>
  </div>
  <script src="../portable_config/webmods/Utilities/media-provider-client.js"></script>
  <script src="../portable_config/webmods/Utilities/player-handoff-bridge.js"></script>
